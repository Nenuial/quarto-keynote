title: Keynote
author: Pascal Burkhard
version: 2.1.2
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: ["global.scss", "letterbox.scss", "timeline.scss", "custom-callouts.scss"]
      include-after-body: "theme.html"
      filters:
        - custom-callouts.lua
      revealjs-plugins:
        - codewindow
      width: 1280
      height: 720
source: nenuial/quarto-keynote
