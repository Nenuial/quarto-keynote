title: Keynote
author: Pascal Burkhard
version: 3.14.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: ["global.scss", "letterbox.scss", "custom-callouts.scss", "infographic.scss"]
      include-after-body: "theme.html"
      filters:
        - custom-callouts.lua
        - badges.lua
        - french-spaces.lua
      revealjs-plugins:
        - codewindow
        - deck
      width: 1280
      height: 720
source: nenuial/quarto-keynote
